<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#grad)" />
  <rect width="512" height="256" rx="128" fill="url(#glow)" />
  
  <!-- Clock Circle -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#ffffff" stroke-width="24" opacity="0.9" />
  
  <!-- Clock Hands -->
  <line x1="256" y1="256" x2="256" y2="148" stroke="#ffffff" stroke-width="20" stroke-linecap="round" />
  <line x1="256" y1="256" x2="330" y2="256" stroke="#ffffff" stroke-width="20" stroke-linecap="round" />
  <circle cx="256" cy="256" r="16" fill="#ffffff" />
  
  <!-- Fingerprint & Check Badge in bottom right -->
  <circle cx="360" cy="360" r="76" fill="#10b981" stroke="#ffffff" stroke-width="14" />
  <path d="M334 360 l20 20 l36 -38" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
</svg>
